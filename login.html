<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="cslogo.css">
</head>

<body>
    <div class="center">
        <h1>Login</h1>
        <form onsubmit="logar(); return false;">
            <div class="txt_field">
                <input type="text" id="login" required>
                <label>Usuário</label>
            </div>
            <div class="txt_field">
                <input type="password" id="senha" required>
            <label>Senha</label>
             </div>


            <div class="pass">
                Esqueceu a senha?
            </div>


                 <div class="botoes">
                <input type="submit" value="Conectar" class="btn-conectar">
                <input type="button" value="Cancelar" class="btn-cancelar" onclick="cancelar()">
            </div>

            <div class="signup_link">
                <a href=",">
                 Não é membro? Cadastre-se!
                </a>
            </div>

        </form>
    </div>

     <script src="scripet.js"></script>
</body>

</html>
